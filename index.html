<style>
@font-face { font-family: "Tel Aviv Modernist"; src: url(fonts/telaviv-modernistregular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Tel Aviv Modernist"; src: url(fonts/telaviv-modernistbold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
/* Layout: a student's notebook. Warm paper with grain, white sheets laid over it, one solid color per course. Phone is one column; desktop puts the side column next to the main one. */
:root {
  color-scheme: light;
  --course: #0b6e69; --on-course: #ffffff;
  --bg: #f6f1e7; --surface: #fffdf8; --fg: #2a2520; --muted: #6b6256; --line: #e6dece;
  --due: #a84b0b;
  --path: #f6bb42; --on-path: #2b1d00; --path-step: #fde7b5; --path-next: #ffffff; --work: #e2743b;
  --soft: color-mix(in srgb, var(--course) 10%, var(--surface));
  --sheet: 0 1px 0 rgba(90,70,40,.08), 0 10px 22px -16px rgba(90,70,40,.35);
  --display: "Suez One", "Assistant", serif;
  --title: "Tel Aviv Modernist", "Rubik", "Assistant", Arial, sans-serif;
  --hand: "Gveret Levin", "Assistant", cursive;
  --body: "Assistant", Arial, sans-serif;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .45 0 0 0 0 .38 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--grain); opacity: .32; pointer-events: none; }
a { color: inherit; }
button { font-family: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--due); outline-offset: 2px; }
.wrap { max-width: 1040px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.icon { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.bar { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.bar.tinted { background: var(--course); color: var(--on-course); }
.bar .wrap { display: flex; align-items: center; gap: 8px; min-height: 56px; }
.menu-btn { width: 46px; height: 46px; display: grid; place-items: center; background: none; border: 0; color: inherit; cursor: pointer; border-radius: 10px; }
.bar-title { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 19px; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(40,30,20,.45); }
.drawer { position: fixed; top: 0; bottom: 0; right: 0; z-index: 31; width: min(320px, 86vw); background: var(--surface); padding: calc(env(safe-area-inset-top, 0px) + 14px) 14px 20px; overflow-y: auto; display: grid; align-content: start; gap: 4px; }
.drawer a { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 10px; border-radius: 10px; font-weight: 600; text-decoration: none; color: var(--fg); font-size: 17px; }
.drawer a[aria-current="page"] { background: var(--soft); }
.drawer .icon-chip { width: 34px; height: 34px; border-radius: 9px; background: var(--c); color: #fff; display: grid; place-items: center; flex: none; }
.drawer small { margin-inline-start: auto; color: var(--muted); font-weight: 400; }
.drawer hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 8px 0; }

.band { background: var(--course); color: var(--on-course); }
.band .wrap { position: relative; padding-block: 8px 24px; display: grid; gap: 12px; }
.band-icon { position: absolute; inset-inline-end: 16px; top: 2px; width: 58px; height: 58px; opacity: .85; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 7vw, 40px); line-height: 1.15; margin: 0; padding-inline-end: 70px; text-wrap: balance; }
.sub { margin: 0; font-size: 17px; padding-inline-end: 70px; }
.sub.hours { display: inline-flex; justify-self: start; padding-inline-end: 14px; align-items: center; gap: 8px; min-height: 38px; padding: 4px 14px; border-radius: 10px; background: rgba(255,255,255,.18); font-weight: 700; font-size: 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 8px 18px; border-radius: 12px; font: 700 16px var(--body); text-decoration: none; border: 0; cursor: pointer; background: #ffffff; color: var(--fg); }
.btn.ghost { background: transparent; color: var(--on-course); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.65); }
.live { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 12px 14px; border-radius: 12px; background: var(--surface); color: var(--fg); box-shadow: var(--sheet); }
.live b { font-family: var(--title); font-weight: 700; font-size: 18px; }
.live .btn { background: var(--course); color: var(--on-course); }

main.wrap { padding-block: 22px 40px; display: grid; gap: 30px; }
.cols { display: grid; gap: 30px; min-width: 0; }
.col { display: grid; gap: 30px; align-content: start; min-width: 0; }
section { display: grid; gap: 12px; min-width: 0; align-content: start; }
h2 { font-family: var(--display); font-weight: 400; font-size: 23px; margin: 0; }
.lead { margin: 0; color: var(--muted); }
.note { margin: 0; color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 12px; }
.tile-group { display: contents; }
.mode { display: none; }
.tile { position: relative; display: grid; gap: 4px; justify-items: center; align-content: center; padding: 14px 10px; min-height: 136px; border-radius: 14px; text-align: center; text-decoration: none; background: var(--c); color: #ffffff; box-shadow: var(--sheet); transition: transform .15s; }
.tile { grid-column: span 3; }
.tile:hover { transform: translateY(-2px); }
.tile-group:not(.trio):last-child .tile:last-child:nth-of-type(odd) { grid-column: 1 / -1; min-height: 112px; }
.trio .tile { grid-column: span 2; padding-inline: 6px; }
.trio .tile b { font-size: 18px; }
.tile svg { width: 32px; height: 32px; }
.tile b { font-family: var(--title); font-weight: 700; font-size: 21px; line-height: 1.2; text-wrap: balance; }
.tile span { font-size: 15px; font-weight: 600; }
.tile .fresh { position: absolute; top: 8px; inset-inline-end: 8px; padding: 1px 8px; border-radius: 99px; background: var(--surface); color: var(--fg); font-size: 13px; font-weight: 700; }

.list { display: grid; gap: 10px; }
.soon { display: grid; grid-template-columns: 74px minmax(0,1fr); background: var(--surface); border-radius: 12px; overflow: hidden; text-decoration: none; box-shadow: var(--sheet); }
.when { display: grid; justify-items: center; align-content: center; padding: 10px 4px; background: var(--c); color: #ffffff; font-variant-numeric: tabular-nums; }
.when strong { font-family: var(--title); font-weight: 700; font-size: 20px; line-height: 1.2; }
.when span { font-size: 15px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
.soon-body { padding: 10px 14px; min-width: 0; display: grid; gap: 1px; align-content: center; }
.soon p { margin: 0; }
.soon-course { font-size: 15px; color: var(--muted); }
.soon-title { font-weight: 700; line-height: 1.3; }
.soon-note { font-size: 15px; color: var(--muted); }
.soft-tag { display: inline-block; margin-inline-start: 6px; padding: 0 8px; border-radius: 99px; font-size: 14px; font-weight: 700; color: var(--due); box-shadow: inset 0 0 0 1px currentColor; }
.cal { justify-self: start; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; font-weight: 700; font-size: 15px; color: var(--due); }
.extra a { display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 8px 14px; border-top: 1px solid var(--line); font-weight: 700; text-decoration: none; }
.extra a:first-child { border-top: 0; }
.extra a::after { content: "←"; color: var(--muted); }

.sheet { background: var(--surface); border-radius: 12px; box-shadow: var(--sheet); overflow: hidden; }
.lesson { display: grid; gap: 8px; padding: 14px; border-top: 1px solid var(--line); }
.lesson:first-child { border-top: 0; }
.lesson-head { margin: 0; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.topic { margin: 0; font-weight: 600; line-height: 1.35; }
.links { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.chip { display: inline-flex; align-items: center; min-height: 44px; padding: 2px 16px; border-radius: 10px; font-weight: 700; font-size: 16px; text-decoration: none; background: var(--course); color: var(--on-course); }
.ask { font-weight: 700; font-size: 15px; color: var(--due); }
details.fold > summary { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px; font-weight: 700; cursor: pointer; list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; font-family: var(--title); font-size: 22px; line-height: 1; color: var(--muted); }
details.fold[open] > summary::after { content: "−"; }
.older { margin-top: 10px; }
.older > summary { color: var(--course); }

.mail { display: grid; gap: 2px; padding: 12px 14px; }
.mail-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 12px; }
.mail b { direction: ltr; unicode-bidi: isolate; user-select: all; overflow-wrap: anywhere; }
.copy { font: 700 15px var(--body); color: var(--due); background: none; border: 0; text-decoration: underline; cursor: pointer; min-height: 44px; padding: 0 2px; }
.mail small { font-size: 15px; color: var(--muted); }

.path { background: var(--path); color: var(--on-path); border-radius: 12px; box-shadow: var(--sheet); }
.path > summary::after { color: var(--on-path); }
.path-inner { padding: 0 12px 14px; display: grid; gap: 8px; }
.path-count { font-weight: 600; font-size: 15px; margin: 0; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.step { display: grid; grid-template-columns: 46px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 8px 12px 8px 14px; border-radius: 12px; background: var(--path-step); }
.step.next-step { background: var(--path-next); box-shadow: 0 0 0 2px var(--on-path); }
.step.done { background: transparent; box-shadow: inset 0 0 0 1px var(--on-path); }
.step.done .step-title { text-decoration: line-through; }
.tick { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--on-path); background: transparent; color: var(--on-path); font-family: var(--title); font-weight: 700; font-size: 18px; line-height: 1; cursor: pointer; font-variant-numeric: tabular-nums; }
.step.done .tick { background: var(--on-path); color: var(--path); }
.step-title { margin: 0; font-weight: 700; line-height: 1.3; }
.step-note { margin: 0; font-size: 15px; }
.step-date { display: grid; justify-items: center; min-width: 60px; min-height: 44px; align-content: center; text-decoration: none; font-variant-numeric: tabular-nums; }
.step-date strong { font-family: var(--title); font-weight: 700; font-size: 17px; line-height: 1.2; }
.step-date span { font-size: 14px; }
.step-date u { display: inline-flex; align-items: center; gap: 3px; font-size: 14px; font-weight: 700; text-decoration: none; }

.rec-next { display: grid; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--soft); color: var(--fg); text-decoration: none; font-weight: 700; }
.rec-next small { font-size: 15px; font-weight: 600; color: var(--muted); }
.rec-unit { margin: 0; padding: 14px 14px 0; font-weight: 700; color: var(--course); }
.rec { display: grid; grid-template-columns: 46px minmax(0,1fr); gap: 12px; align-items: center; padding: 10px 14px; }
.rec-tick { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--course); background: transparent; color: var(--course); font-family: var(--title); font-weight: 700; font-size: 18px; line-height: 1; cursor: pointer; font-variant-numeric: tabular-nums; }
.rec.done .rec-tick { background: var(--course); color: var(--on-course); }
.rec a { display: block; color: var(--fg); text-decoration: none; }
.rec a b { display: block; line-height: 1.3; text-decoration: underline; text-underline-offset: 3px; }
.rec.done a b { color: var(--muted); }
.rec a span { display: block; font-size: 15px; color: var(--muted); }
.rec-extra { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 4px 14px 14px; }
.rec-extra a { min-height: 44px; display: inline-flex; align-items: center; font-size: 15px; font-weight: 600; color: var(--muted); }
.faq { display: grid; gap: 8px; }
.faq .a { padding: 0 14px 14px; }
.faq .a p { margin: 0; }
.grade { display: grid; grid-template-columns: var(--a) var(--b); margin-top: 10px; border-radius: 8px; overflow: hidden; font-weight: 700; font-size: 15px; }
.grade span { padding: 4px 10px; white-space: nowrap; }
.grade .g1 { background: var(--course); color: var(--on-course); }
.grade .g2 { background: var(--work); color: #2b1d00; }

.hold { padding: 14px; background: var(--surface); border-radius: 12px; box-shadow: var(--sheet); }
.hold b { font-family: var(--hand); font-size: 26px; font-weight: 400; display: block; line-height: 1.2; color: var(--course); }
.hold p { margin: 0; }

.pick { display: grid; gap: 8px; }
.pick label { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; background: var(--surface); border-radius: 12px; box-shadow: var(--sheet); font-weight: 600; cursor: pointer; }
.pick input { width: 22px; height: 22px; accent-color: #0b6e69; }

footer { color: var(--muted); font-size: 15px; }
.install { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 8px 14px; border-radius: 12px; background: var(--surface); box-shadow: var(--sheet); color: var(--fg); font-weight: 700; text-decoration: none; }
.install svg { color: #0b6a7a; }
.help { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 32; max-width: 420px; margin-inline: auto; padding: 18px; border-radius: 16px; background: var(--surface); display: grid; gap: 10px; }
.help h2 { font-size: 21px; }
.help ol { margin: 0; padding-inline-start: 22px; display: grid; gap: 4px; }
.help .btn { background: #0b6a7a; color: #fff; }
.standalone [data-install] { display: none; }

@media (min-width: 860px) {
  [data-install] { display: none; }
  .tiles { grid-template-columns: minmax(0,1fr); }
  .tile-group { display: grid; grid-template-columns: 92px repeat(2, minmax(0,1fr)); gap: 12px; align-items: center; }
  .mode { display: grid; justify-items: center; gap: 2px; font-family: var(--hand); font-size: 25px; line-height: 1; color: var(--muted); }
  .mode svg { width: 50px; height: 28px; }
  .tile { min-height: 156px; }
  .tile, .trio .tile { grid-column: auto; }
  .tile-group.trio { grid-template-columns: 92px repeat(3, minmax(0,1fr)); }
  .trio .tile b { font-size: 21px; }
  .tile-group:not(.trio) .tile:nth-of-type(odd) { grid-column: 2; }
  .tile-group:not(.trio) .tile:last-child:nth-of-type(odd) { grid-column: 2 / -1; min-height: 124px; }
  .tile b { font-size: 25px; }
  .tile span { font-size: 16px; }
  .home-cols { grid-template-columns: minmax(0,1fr) 340px; }
  .course-cols { grid-template-columns: minmax(0,1fr) 360px; }
}
</style>
</head>

<script>
const data = JSON.parse(document.getElementById('data').textContent);
const app = document.getElementById('app');
const overlay = document.getElementById('overlay');

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const day = iso => new Date(iso + 'T12:00:00');
const noon = () => { const t = new Date(); t.setHours(12, 0, 0, 0); return t; };
const daysFrom = iso => Math.round((day(iso) - noon()) / 86400000);
const short = iso => { const d = day(iso); return d.getDate() + '/' + (d.getMonth() + 1); };
const full = iso => short(iso) + '/' + day(iso).getFullYear();
const weekday = iso => day(iso).toLocaleDateString('he-IL', { weekday: 'long' });
const leftText = n => n === 0 ? 'היום' : n === 1 ? 'מחר' : 'עוד ' + n + ' ימים';
const compact = dt => dt.getFullYear() + String(dt.getMonth() + 1).padStart(2, '0') + String(dt.getDate()).padStart(2, '0');
const byId = id => data.courses.find(c => c.id === id);

// One line icon per course, drawn after the picture of its WhatsApp group
const icons = {
  change: '<path d="M10 5a2 2 0 1 1 4 0v1h4a1 1 0 0 1 1 1v4h-1a2 2 0 1 0 0 4h1v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-4h1a2 2 0 1 0 0-4H5V7a1 1 0 0 1 1-1h4z"/>',
  micro: '<rect x="2.5" y="5" width="19" height="14" rx="2"/><rect x="5.5" y="8" width="10" height="8" rx="1"/><circle cx="18.5" cy="9.5" r="1"/><circle cx="18.5" cy="14" r="1"/>',
  decisions: '<path d="M12 22V4M8.5 7.5 12 4l3.5 3.5M12 16c0-3-3-5-7-5M7.5 8 4.5 11l3 3M12 16c0-3 3-5 7-5M16.5 8l3 3-3 3"/>',
  ob: '<circle cx="12" cy="5.5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M10.8 7.7 6.2 15.8M13.2 7.7l4.6 8.1M7.5 18h9"/>',
  labor: '<path d="m13.5 3.5 7 7M11 6l7 7M12.5 7.5l-5 5 4 4 5-5M9.5 14.5 3.5 20.5M12 21h9"/>',
  ai: '<rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>',
  writing: '<path d="m4 20 1-4L16 5l3 3L8 19zM14 7l3 3"/>',
  ketubah: '<circle cx="12" cy="15" r="6.5"/><path d="m9.5 9-1.5-3 2-3h4l2 3-1.5 3"/>'
};
const icon = (id, size) => `<svg class="icon" ${size ? `width="${size}" height="${size}"` : ''} viewBox="0 0 24 24" aria-hidden="true">${icons[id] || ''}</svg>`;
const owl = '<svg class="icon" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 4 3.2 2.4a8 8 0 0 1 7.6 0L19 4v10a7 7 0 0 1-14 0z"/><circle cx="9.3" cy="11" r="2.2"/><circle cx="14.7" cy="11" r="2.2"/><path d="m12 13.5-1 1.3h2z"/></svg>';

const modes = ['פרונטלי', 'זום', 'מתוקשב'];
const calIcon = size => `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>`;
const handArrow = '<svg class="icon" viewBox="0 0 50 28" aria-hidden="true"><path d="M44 6C35 18 22 21 6 16M13 9l-7 7 8 5"/></svg>';

const store = {
  get(key, fallback) { try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (_) { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {} }
};
const myCourses = () => {
  const chosen = store.get('my-courses', null);
  const list = chosen ? data.courses.filter(c => chosen.includes(c.id)) : data.courses;
  return [...(list.length ? list : data.courses)].sort((a, b) => modes.indexOf(a.mode) - modes.indexOf(b.mode));
};

function calendarUrl(course, item) {
  const end = day(item.date); end.setDate(end.getDate() + 1);
  const params = new URLSearchParams({ action: 'TEMPLATE', text: course.name + ': ' + item.title, dates: compact(day(item.date)) + '/' + compact(end), details: item.note || '' });
  return 'https://calendar.google.com/calendar/render?' + params.toString();
}

// Minutes until class, negative while it runs, null outside the window
function liveState(course) {
  const s = course.schedule;
  if (!s) return null;
  const now = new Date();
  if (now.getDay() !== s.day) return null;
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const cur = now.getHours() * 60 + now.getMinutes();
  const start = toMin(s.start), end = toMin(s.end);
  if (cur < start - 30 || cur > end) return null;
  return start - cur;
}
function liveBanner(course) {
  const m = liveState(course);
  if (m === null || !course.zoom) return '';
  const text = m > 0 ? 'השיעור מתחיל עוד ' + m + ' דקות' : 'השיעור מתקיים עכשיו';
  return `<div class="live"><b>${text}</b><a class="btn" href="${esc(course.zoom)}" target="_blank" rel="noopener">כניסה לזום</a></div>`;
}

// A row with the date on a solid color. On the home screen the whole row opens the course.
function soonRow(c, d, home) {
  const when = `<div class="when"><strong>${short(d.date)}</strong><span>${esc(leftText(daysFrom(d.date)).replace('עוד ', ''))}</span></div>`;
  const title = `<p class="soon-title">${esc(d.title)}${d.soft ? '<span class="soft-tag">גמיש</span>' : ''}</p>`;
  if (home) return `<a class="soon" href="#${c.id}" style="--c:${c.color}">${when}<div class="soon-body"><p class="soon-course">${esc(c.short)}</p>${title}</div></a>`;
  return `<article class="soon" style="--c:var(--course)">${when}<div class="soon-body">${title}
    ${d.note ? `<p class="soon-note">${esc(d.note)}</p>` : ''}
    ${d.noCal ? '' : `<a class="cal" href="${esc(calendarUrl(c, d))}" target="_blank" rel="noopener">${calIcon(17)}הוספה ליומן</a>`}
  </div></article>`;
}

function lessonRow(course, l) {
  const links = (l.summaries || []).map(s => s.url
    ? `<a class="chip" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label.replace('הסיכום של ', 'סיכום '))}</a>`
    : `<span class="ask">${esc(s.label)}</span>`).join('');
  return `
  <article class="lesson">
    <p class="lesson-head">שיעור ${l.n} · ${short(l.date)}</p>
    ${l.topic ? `<p class="topic">${esc(l.topic)}</p>` : ''}
    ${links ? `<div class="links">${links}</div>` : ''}
  </article>`;
}

function courseView(c) {
  const lessons = c.lessons || [];
  const past = lessons.filter(l => daysFrom(l.date) < 0).reverse();
  const [latest, ...older] = past;
  const upcoming = c.hold ? [] : (c.deadlines || []).filter(d => daysFrom(d.date) >= 0);
  const shown = c.path ? upcoming.slice(0, 1) : upcoming;
  const nextLesson = lessons.find(l => daysFrom(l.date) >= 0);
  const rows = [
    ...(nextLesson ? [soonRow(c, { date: nextLesson.date, title: 'השיעור הבא, ' + weekday(nextLesson.date), note: (c.when || '').split(', ')[1], noCal: true })] : []),
    ...shown.map(d => soonRow(c, d))
  ].join('');
  const note = c.hold ? '' : c.nextNote;
  return `
  <header class="band"><div class="wrap">
    <span class="band-icon">${icon(c.id)}</span>
    <h1>${esc(c.name)}</h1>
    <p class="sub">${esc(c.lecturer)}${c.when ? '' : ' · ' + esc(c.kind)}</p>
    ${c.when ? `<p class="sub hours"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${esc(c.when)}</p>` : ''}
    <div id="live">${liveBanner(c)}</div>
    <div class="actions">
      ${c.zoom ? `<a class="btn" href="${esc(c.zoom)}" target="_blank" rel="noopener">כניסה לזום</a>` : ''}
      ${(c.lemida || []).slice(0, 1).map(l => `<a class="btn${c.zoom ? ' ghost' : ''}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('')}
      ${c.summariesFolder ? `<a class="btn ghost" href="${esc(c.summariesFolder)}" target="_blank" rel="noopener">כל הסיכומים</a>` : ''}
    </div>
  </div></header>
  <main class="wrap">
    <div class="cols course-cols">
      <div class="col">
        ${c.hold ? `<div class="hold"><b>בהמתנה</b><p>${esc(c.hold)}</p></div>` : ''}
        ${rows || note ? `<section>
          <h2>מה הדבר הבא</h2>
          <div class="list">${rows}${note ? `<p class="note">${esc(note)}</p>` : ''}</div>
        </section>` : ''}
        ${c.units ? `<section>
          <h2>הקלטות</h2>
          <p class="note">לחיצה על שם ההקלטה פותחת אותה בלמדה, וצריך להיות מחובר/ת ללמדה. העיגול מסמן מה כבר למדת, והסימון נשמר במכשיר הזה.</p>
          <div class="list" id="units"></div>
        </section>` : ''}
        ${latest ? `<section>
          <h2>סיכומים</h2>
          <div class="sheet">${lessonRow(c, latest)}</div>
          ${older.length ? `<details class="fold sheet older" style="margin-top:0"><summary>שיעורים קודמים (${older.length})</summary>${older.map(l => lessonRow(c, l)).join('')}</details>` : ''}
        </section>` : ''}
        ${c.path && !c.hold ? `<details class="fold path">
          <summary>${esc(c.pathTitle || 'המסלול של העבודה')}</summary>
          <div class="path-inner"><p class="path-count" id="path-count"></p><ol class="steps" id="steps"></ol></div>
        </details>` : ''}
      </div>
      <div class="col">
        ${(c.lemida || []).length > 1 ? `<section><h2>קישורים נוספים</h2><div class="sheet extra">${c.lemida.slice(1).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('')}</div></section>` : ''}
        ${c.email ? `<section><h2>מייל המרצה</h2><div class="sheet mail">
          <div class="mail-row"><b id="mail">${esc(c.email)}</b><button class="copy" id="copy" type="button">העתקה</button></div>
          ${c.emailNote ? `<small>${esc(c.emailNote)}</small>` : ''}
        </div></section>` : ''}
        ${(c.faq || []).length ? `<section>
          <h2>שאלות נפוצות</h2>
          <div class="faq">${c.faq.map(f => `<details class="fold sheet"><summary>${esc(f.q)}</summary><div class="a"><p>${esc(f.a)}</p>${f.grade ? `<div class="grade" style="--a:${f.grade[0].v}fr;--b:${f.grade[1].v}fr"><span class="g1">${esc(f.grade[0].k)} ${f.grade[0].v}%</span><span class="g2">${esc(f.grade[1].k)} ${f.grade[1].v}%</span></div>` : ''}</div></details>`).join('')}</div>
        </section>` : ''}
      </div>
    </div>
    ${footer()}
  </main>`;
}

const footer = () => `<footer>עודכן ב-${full(data.updated)} · מצאת טעות? כתוב/כתבי לי.</footer>`;

// Summaries this phone has not opened the course to see yet. The first visit counts everything as seen.
const summaryUrls = c => (c.lessons || []).flatMap(l => (l.summaries || []).map(s => s.url)).filter(Boolean);
const allSummaries = () => data.courses.flatMap(summaryUrls);
const seenSummaries = () => {
  const seen = store.get('seen-summaries', null);
  if (seen) return seen;
  store.set('seen-summaries', allSummaries());
  return allSummaries();
};
const hasFresh = c => { const seen = seenSummaries(); return summaryUrls(c).some(u => !seen.includes(u)); };
const markSeen = c => store.set('seen-summaries', [...new Set([...seenSummaries(), ...summaryUrls(c)])]);

function homeView() {
  const mine = myCourses().filter(c => !c.hold);
  const dues = mine.flatMap(c => (c.deadlines || []).filter(d => daysFrom(d.date) >= 0).map(d => ({ c, d })))
    .sort((a, b) => a.d.date.localeCompare(b.d.date)).slice(0, 4);
  const liveNow = mine.find(c => liveState(c) !== null && c.zoom);
  return `
  <main class="wrap">
    ${liveNow ? `<div style="--course:${liveNow.color};--on-course:#fff">${liveBanner(liveNow)}</div>` : ''}
    <div class="cols home-cols">
      <section>
        <h2>הקורסים שלי</h2>
        <div class="tiles">${modes.map(m => {
          const group = mine.filter(c => c.mode === m);
          return group.length ? `<div class="tile-group${group.length === 3 ? ' trio' : ''}"><span class="mode">${m}${handArrow}</span>${group.map(c => `<a class="tile" href="#${c.id}" style="--c:${c.color}">${hasFresh(c) ? '<span class="fresh">סיכום חדש</span>' : ''}${icon(c.id)}<b>${esc(c.short)}</b>${c.when ? `<span>${esc(c.when.replace(',', ''))}</span>` : ''}</a>`).join('')}</div>` : '';
        }).join('')}</div>
      </section>
      ${dues.length ? `<section>
        <h2>המועדים הקרובים</h2>
        <div class="list">${dues.map(({ c, d }) => soonRow(c, d, true)).join('')}</div>
      </section>` : ''}
    </div>
    <a class="install" href="#install" data-install><svg class="icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.500-4.500M4 20h16"/></svg>הוספה למסך הבית</a>
    ${footer()}
  </main>`;
}

// Android can show its own install prompt. iPhone has none, and neither does an in-app browser, so those get the steps.
let installPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) document.documentElement.classList.add('standalone');
function showInstallHelp() {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const steps = ios
    ? ['פתחו את האתר בספארי, לא מתוך וואטסאפ', 'לחצו על כפתור השיתוף', 'בחרו "הוספה למסך הבית"']
    : ['פתחו את האתר בכרום, לא מתוך וואטסאפ', 'לחצו על שלוש הנקודות למעלה', 'בחרו "הוספה למסך הבית"'];
  overlay.innerHTML = `<div class="scrim" id="scrim"></div>
    <div class="help" role="dialog" aria-label="הוספה למסך הבית">
      <h2>הוספה למסך הבית</h2>
      <ol>${steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      <button class="btn" id="help-close" type="button">הבנתי</button>
    </div>`;
  document.getElementById('scrim').onclick = closeMenu;
  document.getElementById('help-close').onclick = closeMenu;
}
document.addEventListener('click', e => {
  if (!e.target.closest('[data-install]')) return;
  e.preventDefault();
  if (installPrompt) { installPrompt.prompt(); installPrompt = null; }
  else showInstallHelp();
});

function pickView() {
  const mine = myCourses().map(c => c.id);
  return `
  <main class="wrap">
    <section>
      <h2>בחירת הקורסים שלי</h2>
      <p class="lead">הבחירה נשמרת בטלפון שלך. לא צריך הרשמה.</p>
      <div class="pick">${data.courses.map(c => `<label><input type="checkbox" value="${esc(c.id)}"${mine.includes(c.id) ? ' checked' : ''}>${esc(c.name)}</label>`).join('')}</div>
      <a class="btn" style="background:var(--course);color:var(--on-course);justify-self:start" href="#home">סיום</a>
    </section>
  </main>`;
}

function renderSteps(c) {
  const list = document.getElementById('steps');
  if (!list) return;
  const key = 'steps:' + c.id;
  const done = store.get(key, []);
  const nextIndex = c.path.findIndex((s, i) => !done.includes(i) && (!s.date || daysFrom(s.date) >= 0));
  list.innerHTML = c.path.map((s, i) => {
    const isDone = done.includes(i);
    return `<li class="step${isDone ? ' done' : ''}${i === nextIndex ? ' next-step' : ''}">
      <button class="tick" type="button" data-i="${i}" aria-pressed="${isDone}" aria-label="שלב ${i + 1}: סימון כבוצע">${isDone ? '✓' : i + 1}</button>
      <div><p class="step-title">${esc(s.title)}</p>${s.note ? `<p class="step-note">${esc(s.note)}</p>` : ''}</div>
      ${s.date ? `<a class="step-date" href="${esc(calendarUrl(c, s))}" target="_blank" rel="noopener" aria-label="הוספה ליומן"><strong>${short(s.date)}</strong><span>${s.soft ? 'גמיש' : leftText(daysFrom(s.date))}</span><u>${calIcon(14)}ליומן</u></a>` : '<span></span>'}
    </li>`;
  }).join('');
  document.getElementById('path-count').textContent = done.length ? 'סימנת ' + done.length + ' מתוך ' + c.path.length : 'לוחצים על מספר כשמסיימים שלב';
  list.onclick = e => {
    const b = e.target.closest('.tick');
    if (!b) return;
    const i = Number(b.dataset.i);
    store.set(key, done.includes(i) ? done.filter(x => x !== i) : [...done, i]);
    renderSteps(c);
  };
}

function renderUnits(c) {
  const box = document.getElementById('units');
  if (!box) return;
  const key = 'recordings:' + c.id;
  const done = store.get(key, []);
  // Numbered once across the course, oldest first, so the numbers stay put when a unit is added
  let n = 0;
  const units = c.units.map(u => ({ ...u, items: (u.items || []).map(r => ({ ...r, n: ++n })) }));
  const all = units.flatMap(u => u.items);
  const count = list => list.filter(r => done.includes(r.url)).length;
  const row = r => `<div class="rec${done.includes(r.url) ? ' done' : ''}">
    <button class="rec-tick" type="button" data-url="${esc(r.url)}" aria-pressed="${done.includes(r.url)}" aria-label="הקלטה ${r.n}: סימון שלמדתי">${done.includes(r.url) ? '✓' : r.n}</button>
    <a href="${esc(r.url)}" target="_blank" rel="noopener"><b>הקלטה ${r.n}: ${esc(r.title)}</b>${r.note ? `<span>${esc(r.note)}</span>` : ''}</a>
  </div>`;
  const body = u => `${u.items.length ? u.items.map(row).join('') : ''}${(u.materials || []).length ? `<div class="rec-extra">${u.materials.map(m => `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.label)}</a>`).join('')}</div>` : ''}`;
  const tag = u => u.items.length ? `${count(u.items)} מתוך ${u.items.length}` : 'מצגת וסיכום';
  const opened = [...box.querySelectorAll('details')].filter(x => x.open).map(x => x.dataset.u);
  const latest = units[units.length - 1];
  const older = units.slice(0, -1).reverse();
  const next = all.find(r => !done.includes(r.url));
  // Skipped when the next recording already sits first in the open unit, so nothing shows twice
  const showNext = next && next !== latest.items.find(r => !done.includes(r.url));
  box.innerHTML = `
    ${showNext ? `<a class="rec-next" href="${esc(next.url)}" target="_blank" rel="noopener"><small>ההקלטה הבאה שלך</small>הקלטה ${next.n}: ${esc(next.title)}</a>` : ''}
    <p class="path-count">סימנת ${count(all)} מתוך ${all.length}</p>
    <div class="sheet"><p class="rec-unit">${esc(latest.title)} · ${tag(latest)}</p>${body(latest)}</div>
    ${older.map(u => `<details class="fold sheet" data-u="${esc(u.title)}"${opened.includes(u.title) ? ' open' : ''}><summary>${esc(u.title)} · ${tag(u)}</summary>${body(u)}</details>`).join('')}`;
  box.onclick = e => {
    const b = e.target.closest('.rec-tick');
    if (!b) return;
    const url = b.dataset.url;
    store.set(key, done.includes(url) ? done.filter(x => x !== url) : [...done, url]);
    renderUnits(c);
  };
}

function closeMenu() { overlay.innerHTML = ''; document.getElementById('menu')?.setAttribute('aria-expanded', 'false'); }
function openMenu(route) {
  overlay.innerHTML = `<div class="scrim" id="scrim"></div>
    <nav class="drawer" aria-label="הקורסים">
      <a href="#home"${route === 'home' ? ' aria-current="page"' : ''}>מסך הפתיחה</a>
      <hr>
      ${myCourses().map(c => `<a href="#${c.id}" style="--c:${c.color}"${route === c.id ? ' aria-current="page"' : ''}><span class="icon-chip">${icon(c.id, 20)}</span>${esc(c.short)}${c.hold ? '<small>בהמתנה</small>' : ''}</a>`).join('')}
      <hr>
      <a href="#pick">בחירת הקורסים שלי</a>
      <a href="#install" data-install>הוספה למסך הבית</a>
    </nav>`;
  document.getElementById('scrim').onclick = closeMenu;
  overlay.querySelectorAll('a').forEach(a => { a.onclick = closeMenu; });
  document.getElementById('menu').setAttribute('aria-expanded', 'true');
}

function render() {
  const route = (location.hash || '#home').slice(1);
  const course = byId(route);
  const color = course ? course.color : '#0b6e69';
  document.documentElement.style.setProperty('--course', color);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', course ? color : '#f6f1e7');
  document.title = course ? course.name : 'הקורסים של ינשופים';
  app.innerHTML = `
  <div class="bar${course ? ' tinted' : ''}"><div class="wrap">
    <button class="menu-btn" id="menu" type="button" aria-label="תפריט הקורסים" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <a class="bar-title" href="#home">${owl}ינשופים</a>
  </div></div>
  ${route === 'pick' ? pickView() : course ? courseView(course) : homeView()}`;
  document.getElementById('menu').onclick = () => overlay.innerHTML ? closeMenu() : openMenu(route);
  window.scrollTo(0, 0);
  if (course) {
    markSeen(course);
    renderSteps(course);
    renderUnits(course);
    const copy = document.getElementById('copy');
    if (copy) copy.onclick = () => {
      const done = () => { copy.textContent = 'הועתק'; setTimeout(() => { copy.textContent = 'העתקה'; }, 1600); };
      const pick = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('mail')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent = 'סומן, אפשר להעתיק'; };
      try { navigator.clipboard.writeText(course.email).then(done, pick); } catch (_) { pick(); }
    };
  }
  app.querySelectorAll('.pick input').forEach(box => {
    box.onchange = () => store.set('my-courses', [...app.querySelectorAll('.pick input:checked')].map(i => i.value));
  });
}

addEventListener('hashchange', () => { closeMenu(); render(); });
setInterval(() => {
  const c = byId((location.hash || '').slice(1));
  const slot = document.getElementById('live');
  if (c && slot) slot.innerHTML = liveBanner(c);
}, 60000);
render();
</script>
</body>
</html>
