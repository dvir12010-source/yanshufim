/* Layout: a menu bar, then a solid course-colored band, then what a student needs now, lessons, the work path and short answers. */
:root {
  --course: #0b6e69; --on-course: #ffffff;
  --bg: #f4f8f7; --surface: #ffffff; --fg: #15302e; --muted: #557370; --line: #d3e2df;
  --due: #b45309; --due-soft: #fdecd2;
  --path: #f6bb42; --on-path: #2b1d00; --path-step: #fde7b5; --path-next: #ffffff; --work: #e2743b;
  --soft: color-mix(in srgb, var(--course) 13%, var(--bg));
  --display: "Secular One", "Assistant", Arial, sans-serif;
  --body: "Assistant", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1c1b; --surface: #172726; --fg: #e4f1ef; --muted: #9db8b4; --line: #2a403e;
  --due: #f6b45c; --due-soft: #3d2d14;
  --path: #e0a12e; --on-path: #221600; --path-step: #efc26a; --path-next: #fff3d6; --work: #e0713a;
  --soft: color-mix(in srgb, var(--course) 30%, var(--bg)); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1c1b; --surface: #172726; --fg: #e4f1ef; --muted: #9db8b4; --line: #2a403e;
  --due: #f6b45c; --due-soft: #3d2d14;
  --path: #e0a12e; --on-path: #221600; --path-step: #efc26a; --path-next: #fff3d6; --work: #e0713a;
  --soft: color-mix(in srgb, var(--course) 30%, var(--bg)); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5; }
a { color: inherit; }
button { font-family: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--due); outline-offset: 2px; }
.wrap { max-width: 860px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.bar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.bar .wrap { display: flex; align-items: center; gap: 8px; min-height: 54px; }
.menu-btn { width: 46px; height: 46px; display: grid; place-items: center; background: none; border: 0; color: var(--fg); cursor: pointer; border-radius: 10px; }
.bar-title { font-family: var(--display); font-size: 18px; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); }
.drawer { position: fixed; top: 0; bottom: 0; right: 0; z-index: 31; width: min(320px, 86vw); background: var(--surface); padding: calc(env(safe-area-inset-top, 0px) + 14px) 14px 20px; overflow-y: auto; display: grid; align-content: start; gap: 4px; }
.drawer a, .drawer button.link { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 10px; border-radius: 10px; font-weight: 700; text-decoration: none; background: none; border: 0; color: var(--fg); font-size: 17px; cursor: pointer; text-align: right; width: 100%; }
.drawer a[aria-current="page"] { background: var(--soft); }
.dot { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
.drawer hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 8px 0; }

.band { background: var(--course); color: var(--on-course); }
.band .wrap { padding-block: 24px; display: grid; gap: 12px; }
.kind { justify-self: start; font-weight: 700; font-size: 15px; padding: 2px 12px; border-radius: 99px; background: rgba(255,255,255,.2); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 7vw, 42px); line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { margin: 0; font-size: 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; min-height: 46px; padding: 8px 18px; border-radius: 10px; font: 700 17px var(--body); text-decoration: none; border: 0; cursor: pointer; background: #ffffff; color: #15302e; }
.btn.ghost { background: transparent; color: var(--on-course); box-shadow: inset 0 0 0 2px rgba(255,255,255,.65); }
.live { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 12px 14px; border-radius: 12px; background: #ffffff; color: #15302e; }
.live b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.live .btn { background: var(--course); color: var(--on-course); }

main.wrap { padding-block: 24px 40px; display: grid; gap: 32px; }
section { display: grid; gap: 12px; min-width: 0; }
h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; }
.lead { margin: 0; color: var(--muted); }

.mail { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 12px 14px; background: var(--soft); border-radius: 10px; }
.mail b { direction: ltr; unicode-bidi: isolate; user-select: all; overflow-wrap: anywhere; }
.copy { font: 700 15px var(--body); color: inherit; background: none; border: 0; text-decoration: underline; cursor: pointer; min-height: 44px; padding: 0 2px; }
.mail small { flex-basis: 100%; font-size: 15px; }

.news { display: grid; gap: 8px; }
.news a { display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 2px 10px; align-items: baseline; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; }
.news strong { font-size: 16px; }
.news span.t { grid-column: 2; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tile { display: grid; gap: 2px; align-content: start; padding: 14px; min-height: 92px; border-radius: 12px; text-decoration: none; background: var(--c); color: #ffffff; }
.tile b { font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1.2; }

.next { display: grid; gap: 10px; }
.next-lesson { margin: 0; }
.due { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 2px 14px; align-items: start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.due.first { background: var(--due-soft); border-color: transparent; }
.when { grid-row: span 4; display: grid; justify-items: center; font-variant-numeric: tabular-nums; }
.when strong { font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.2; }
.when span { font-size: 14px; color: var(--muted); text-align: center; }
.due h3 { margin: 0; font-size: 18px; line-height: 1.3; }
.due p { margin: 0; }
.left { color: var(--due); font-weight: 700; font-size: 15px; }
.soft-tag { display: inline-block; margin-inline-start: 6px; padding: 0 8px; border-radius: 99px; font-size: 14px; font-weight: 700; color: var(--due); box-shadow: inset 0 0 0 1px currentColor; }
.src { font-size: 14px; color: var(--muted); }
.cal { justify-self: start; display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; font-size: 15px; color: var(--due); }
.ask { font-weight: 700; font-size: 15px; color: var(--due); }

.lessons { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.lesson { display: grid; grid-template-columns: 74px minmax(0,1fr) minmax(0,1fr); gap: 4px 14px; padding: 13px 14px; border-top: 1px solid var(--line); }
.lesson:first-child { border-top: 0; }
.lesson.upcoming { background: var(--soft); }
.num { font-variant-numeric: tabular-nums; display: grid; justify-items: center; align-content: start; }
.num strong { font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.2; }
.num span { font-size: 14px; color: var(--muted); }
.topic { margin: 0; min-width: 0; }
.links { display: flex; flex-wrap: wrap; align-content: start; gap: 6px; min-width: 0; }
.chip { display: inline-flex; align-items: center; min-height: 40px; padding: 2px 12px; border-radius: 8px; font-weight: 700; font-size: 15px; text-decoration: none; background: var(--course); color: var(--on-course); }
.none { color: var(--muted); font-size: 15px; }

.path { background: var(--path); color: var(--on-path); border-radius: 14px; padding: 20px 16px; }
.path-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.path-count { font-weight: 700; font-size: 15px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.step { display: grid; grid-template-columns: 46px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 8px 12px 8px 14px; border-radius: 12px; background: var(--path-step); }
.step.next-step { background: var(--path-next); box-shadow: 0 0 0 2px var(--on-path); }
.step.done { background: transparent; box-shadow: inset 0 0 0 1px var(--on-path); }
.step.done .step-title { text-decoration: line-through; }
.tick { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--on-path); background: transparent; color: var(--on-path); font-family: var(--display); font-size: 20px; line-height: 1; cursor: pointer; font-variant-numeric: tabular-nums; }
.step.done .tick { background: var(--on-path); color: var(--path); }
.step-title { margin: 0; font-weight: 700; line-height: 1.3; }
.step-note { margin: 0; font-size: 15px; }
.step-date { display: grid; justify-items: center; min-width: 60px; min-height: 44px; align-content: center; text-decoration: none; font-variant-numeric: tabular-nums; }
.step-date strong { font-family: var(--display); font-weight: 400; font-size: 19px; line-height: 1.2; }
.step-date span { font-size: 14px; }
.step-date u { font-size: 14px; font-weight: 700; }

.faq { display: grid; gap: 8px; }
.faq details { background: var(--soft); border-radius: 10px; }
.faq summary { min-height: 48px; display: flex; align-items: center; padding: 8px 14px; font-weight: 700; cursor: pointer; }
.faq .a { padding: 0 14px 14px; }
.faq .a p { margin: 0; }
.grade { display: grid; grid-template-columns: var(--a) var(--b); margin-top: 10px; border-radius: 8px; overflow: hidden; font-weight: 700; font-size: 15px; }
.grade span { padding: 4px 10px; white-space: nowrap; }
.grade .g1 { background: var(--course); color: var(--on-course); }
.grade .g2 { background: var(--work); color: #2b1d00; }

.pick { display: grid; gap: 8px; }
.pick label { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-weight: 700; cursor: pointer; }
.pick input { width: 22px; height: 22px; accent-color: #0b6e69; }

footer { color: var(--muted); font-size: 15px; }

@media (max-width: 640px) {
  .lesson { grid-template-columns: 62px minmax(0,1fr); }
  .links { grid-column: 2; }
  .btn { flex: 1 1 auto; justify-content: center; }
}
</style>
</head>

<script>
const data = JSON.parse(document.getElementById('data').textContent);
const app = document.getElementById('app');
const overlay = document.getElementById('overlay');

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const day = iso => new Date(iso + 'T12:00:00');
const noon = () => { const t = new Date(); t.setHours(12, 0, 0, 0); return t; };
const daysFrom = iso => Math.round((day(iso) - noon()) / 86400000);
const short = iso => { const d = day(iso); return d.getDate() + '/' + (d.getMonth() + 1); };
const full = iso => short(iso) + '/' + day(iso).getFullYear();
const weekday = iso => day(iso).toLocaleDateString('he-IL', { weekday: 'long' });
const leftText = n => n === 0 ? 'היום' : n === 1 ? 'מחר' : 'עוד ' + n + ' ימים';
const compact = dt => dt.getFullYear() + String(dt.getMonth() + 1).padStart(2, '0') + String(dt.getDate()).padStart(2, '0');
const byId = id => data.courses.find(c => c.id === id);

const store = {
  get(key, fallback) { try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (_) { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {} }
};
const myCourses = () => {
  const chosen = store.get('my-courses', null);
  const list = chosen ? data.courses.filter(c => chosen.includes(c.id)) : data.courses;
  return list.length ? list : data.courses;
};

function calendarUrl(course, item) {
  const end = day(item.date); end.setDate(end.getDate() + 1);
  const params = new URLSearchParams({ action: 'TEMPLATE', text: course.name + ': ' + item.title, dates: compact(day(item.date)) + '/' + compact(end), details: item.note || '' });
  return 'https://calendar.google.com/calendar/render?' + params.toString();
}

// Minutes until class, negative while it runs, null outside the window
function liveState(course) {
  const s = course.schedule;
  if (!s) return null;
  const now = new Date();
  if (now.getDay() !== s.day) return null;
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const cur = now.getHours() * 60 + now.getMinutes();
  const start = toMin(s.start), end = toMin(s.end);
  if (cur < start - 30 || cur > end) return null;
  return start - cur;
}
function liveBanner(course) {
  const m = liveState(course);
  if (m === null || !course.zoom) return '';
  const text = m > 0 ? 'השיעור מתחיל עוד ' + m + ' דקות' : 'השיעור מתקיים עכשיו';
  return `<div class="live"><b>${text}</b><a class="btn" href="${esc(course.zoom)}" target="_blank" rel="noopener">כניסה לזום</a></div>`;
}

const dueCard = (course, d, first) => `
  <article class="due${first ? ' first' : ''}">
    <div class="when"><strong>${short(d.date)}</strong><span>${esc(weekday(d.date))}</span></div>
    <h3>${esc(d.title)}${d.soft ? '<span class="soft-tag">גמיש</span>' : ''}</h3>
    ${d.note ? `<p>${esc(d.note)}</p>` : ''}
    <p><span class="left">${leftText(daysFrom(d.date))}</span> <span class="src">· לפי ${esc(d.source)}</span></p>
    <a class="cal" href="${esc(calendarUrl(course, d))}" target="_blank" rel="noopener">הוספה ליומן</a>
  </article>`;

function lessonRow(course, l) {
  const future = daysFrom(l.date) >= 0;
  const links = (l.summaries || []).map(s => s.url
    ? `<a class="chip" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`
    : `<span class="none">${esc(s.label)}</span>`).join('');
  const ask = course.group
    ? `<a class="chip" href="${esc(course.group)}" target="_blank" rel="noopener">יש לך סיכום? שלח/י בקבוצה</a>`
    : '<span class="ask">יש לך סיכום? שלח/י בקבוצה</span>';
  return `
  <article class="lesson${future ? ' upcoming' : ''}">
    <div class="num"><strong>${l.n}</strong><span>${short(l.date)}</span></div>
    <p class="topic">${l.topic ? esc(l.topic) : 'הנושא יתפרסם בלמדה'}</p>
    <div class="links">${links || (future ? '<span class="none">עוד לא היה</span>' : ask)}</div>
  </article>`;
}

function courseView(c) {
  const lessons = c.lessons || [];
  const upcoming = (c.deadlines || []).filter(d => daysFrom(d.date) >= 0);
  const shown = c.path ? upcoming.slice(0, 2) : upcoming;
  const nextLesson = lessons.find(l => daysFrom(l.date) >= 0);
  const hasNext = nextLesson || shown.length || c.nextNote;
  return `
  <header class="band"><div class="wrap">
    <span class="kind">${esc(c.kind)}</span>
    <h1>${esc(c.name)}</h1>
    <p class="sub">${esc(c.lecturer)}${c.when ? ' · ' + esc(c.when) : ''}</p>
    <div id="live">${liveBanner(c)}</div>
    <div class="actions">
      ${c.zoom ? `<a class="btn" href="${esc(c.zoom)}" target="_blank" rel="noopener">כניסה לזום</a>` : ''}
      ${(c.lemida || []).map((l, i) => `<a class="btn${(i === 0 && !c.zoom) ? '' : ' ghost'}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('')}
      ${c.summariesFolder ? `<a class="btn ghost" href="${esc(c.summariesFolder)}" target="_blank" rel="noopener">כל הסיכומים</a>` : ''}
    </div>
  </div></header>
  <main class="wrap">
    ${c.email ? `<section aria-label="מייל המרצה"><div class="mail">
      <span>מייל המרצה</span> <b id="mail">${esc(c.email)}</b>
      <button class="copy" id="copy" type="button">העתקה</button>
      ${c.emailNote ? `<small>${esc(c.emailNote)}</small>` : ''}
    </div></section>` : ''}
    ${hasNext ? `<section>
      <h2>מה הדבר הבא</h2>
      <div class="next">
        ${nextLesson ? `<p class="next-lesson">השיעור הבא: <b>${esc(weekday(nextLesson.date))} ${short(nextLesson.date)}</b> (${leftText(daysFrom(nextLesson.date))})</p>` : ''}
        ${c.nextNote ? `<p class="next-lesson">${esc(c.nextNote)}</p>` : ''}
        ${shown.map((d, i) => dueCard(c, d, i === 0)).join('')}
      </div>
    </section>` : ''}
    ${lessons.length ? `<section>
      <h2>שיעורים וסיכומים</h2>
      <div class="lessons">${lessons.map(l => lessonRow(c, l)).join('')}</div>
    </section>` : ''}
    ${c.path ? `<section class="path" aria-label="המסלול של העבודה">
      <div class="path-head"><h2>${esc(c.pathTitle || 'המסלול של העבודה')}</h2><span class="path-count" id="path-count"></span></div>
      <ol class="steps" id="steps"></ol>
    </section>` : ''}
    ${(c.faq || []).length ? `<section>
      <h2>שאלות נפוצות</h2>
      <div class="faq">${c.faq.map(f => `<details><summary>${esc(f.q)}</summary><div class="a"><p>${esc(f.a)}</p>${f.grade ? `<div class="grade" style="--a:${f.grade[0].v}fr;--b:${f.grade[1].v}fr"><span class="g1">${esc(f.grade[0].k)} ${f.grade[0].v}%</span><span class="g2">${esc(f.grade[1].k)} ${f.grade[1].v}%</span></div>` : ''}</div></details>`).join('')}</div>
    </section>` : ''}
    ${footer(c.number ? 'מספר קורס ' + esc(c.number) + ' · ' : '')}
  </main>`;
}

const footer = extra => `<footer>עודכן לאחרונה ב-${full(data.updated)} · ${extra}מצאת טעות? כתוב/כתבי בקבוצה של הקורס.</footer>`;

function homeView() {
  const mine = myCourses();
  const freshNews = daysFrom(data.newsDate) >= -9;
  const news = freshNews ? (data.news || []).filter(n => mine.some(c => c.id === n.course)) : [];
  const dues = mine.flatMap(c => (c.deadlines || []).filter(d => daysFrom(d.date) >= 0).map(d => ({ c, d })))
    .sort((a, b) => a.d.date.localeCompare(b.d.date)).slice(0, 3);
  const liveNow = mine.find(c => liveState(c) !== null && c.zoom);
  return `
  <main class="wrap">
    ${liveNow ? `<div style="--course:${liveNow.color};--on-course:#fff">${liveBanner(liveNow)}</div>` : ''}
    ${news.length ? `<section>
      <h2>מה חדש השבוע</h2>
      <div class="news">${news.map(n => { const c = byId(n.course); return `<a href="#${c.id}" style="--c:${c.color}"><span class="dot"></span><strong>${esc(c.short)}</strong><span class="t">${esc(n.text)}</span></a>`; }).join('')}</div>
    </section>` : ''}
    ${dues.length ? `<section>
      <h2>המועדים הקרובים</h2>
      <div class="next">${dues.map(({ c, d }, i) => dueCard(c, Object.assign({}, d, { title: c.short + ': ' + d.title, source: d.source }), i === 0)).join('')}</div>
    </section>` : ''}
    <section>
      <h2>הקורסים שלי</h2>
      <div class="tiles">${mine.map(c => `<a class="tile" href="#${c.id}" style="--c:${c.color}"><b>${esc(c.name)}</b><span>${esc(c.kind)}</span></a>`).join('')}</div>
    </section>
    ${footer('')}
  </main>`;
}

function pickView() {
  const mine = myCourses().map(c => c.id);
  return `
  <main class="wrap">
    <section>
      <h2>בחירת הקורסים שלי</h2>
      <p class="lead">הבחירה נשמרת בטלפון שלך. לא צריך הרשמה.</p>
      <div class="pick">${data.courses.map(c => `<label style="--c:${c.color}"><input type="checkbox" value="${esc(c.id)}"${mine.includes(c.id) ? ' checked' : ''}><span class="dot"></span>${esc(c.name)}</label>`).join('')}</div>
      <a class="btn" style="background:var(--course);color:var(--on-course);justify-self:start" href="#home">סיום</a>
    </section>
  </main>`;
}

function renderSteps(c) {
  const list = document.getElementById('steps');
  if (!list) return;
  const key = 'steps:' + c.id;
  const done = store.get(key, []);
  const nextIndex = c.path.findIndex((s, i) => !done.includes(i) && (!s.date || daysFrom(s.date) >= 0));
  list.innerHTML = c.path.map((s, i) => {
    const isDone = done.includes(i);
    return `<li class="step${isDone ? ' done' : ''}${i === nextIndex ? ' next-step' : ''}">
      <button class="tick" type="button" data-i="${i}" aria-pressed="${isDone}" aria-label="שלב ${i + 1}: סימון כבוצע">${isDone ? '✓' : i + 1}</button>
      <div><p class="step-title">${esc(s.title)}</p>${s.note ? `<p class="step-note">${esc(s.note)}</p>` : ''}</div>
      ${s.date ? `<a class="step-date" href="${esc(calendarUrl(c, s))}" target="_blank" rel="noopener" aria-label="הוספה ליומן"><strong>${short(s.date)}</strong><span>${s.soft ? 'גמיש' : leftText(daysFrom(s.date))}</span><u>ליומן</u></a>` : '<span></span>'}
    </li>`;
  }).join('');
  document.getElementById('path-count').textContent = done.length ? 'סימנת ' + done.length + ' מתוך ' + c.path.length : 'לוחצים על מספר כשמסיימים שלב';
  list.onclick = e => {
    const b = e.target.closest('.tick');
    if (!b) return;
    const i = Number(b.dataset.i);
    store.set(key, done.includes(i) ? done.filter(x => x !== i) : [...done, i]);
    renderSteps(c);
  };
}

function closeMenu() { overlay.innerHTML = ''; document.getElementById('menu')?.setAttribute('aria-expanded', 'false'); }
function openMenu(route) {
  overlay.innerHTML = `<div class="scrim" id="scrim"></div>
    <nav class="drawer" aria-label="הקורסים">
      <a href="#home"${route === 'home' ? ' aria-current="page"' : ''}>מסך הפתיחה</a>
      <hr>
      ${myCourses().map(c => `<a href="#${c.id}" style="--c:${c.color}"${route === c.id ? ' aria-current="page"' : ''}><span class="dot"></span>${esc(c.name)}</a>`).join('')}
      <hr>
      <a href="#pick">בחירת הקורסים שלי</a>
    </nav>`;
  document.getElementById('scrim').onclick = closeMenu;
  overlay.querySelectorAll('a').forEach(a => { a.onclick = closeMenu; });
  document.getElementById('menu').setAttribute('aria-expanded', 'true');
}

function render() {
  const route = (location.hash || '#home').slice(1);
  const course = byId(route);
  const color = course ? course.color : '#0b6e69';
  document.documentElement.style.setProperty('--course', color);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', color);
  document.title = course ? course.name : 'הקורסים של ינשופים';
  const title = course ? course.name : 'הקורסים של ינשופים';
  app.innerHTML = `
  <div class="bar"><div class="wrap">
    <button class="menu-btn" id="menu" type="button" aria-label="תפריט הקורסים" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <a class="bar-title" href="#home">${esc(title)}</a>
  </div></div>
  ${route === 'pick' ? pickView() : course ? courseView(course) : homeView()}`;
  document.getElementById('menu').onclick = () => overlay.innerHTML ? closeMenu() : openMenu(route);
  window.scrollTo(0, 0);
  if (course) {
    renderSteps(course);
    const copy = document.getElementById('copy');
    if (copy) copy.onclick = () => {
      const done = () => { copy.textContent = 'הועתק'; setTimeout(() => { copy.textContent = 'העתקה'; }, 1600); };
      const pick = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('mail')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent = 'סומן, אפשר להעתיק'; };
      try { navigator.clipboard.writeText(course.email).then(done, pick); } catch (_) { pick(); }
    };
  }
  app.querySelectorAll('.pick input').forEach(box => {
    box.onchange = () => store.set('my-courses', [...app.querySelectorAll('.pick input:checked')].map(i => i.value));
  });
}

addEventListener('hashchange', () => { closeMenu(); render(); });
setInterval(() => {
  const c = byId((location.hash || '').slice(1));
  const slot = document.getElementById('live');
  if (c && slot) slot.innerHTML = liveBanner(c);
}, 60000);
render();
</script>
</body>
</html>
